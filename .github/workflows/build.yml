# Builds every supported Minecraft version on each push / pull request and keeps the jars as a download.
# Runs PR code, so it only ever gets a read-only token and no secrets (plain `pull_request`, never
# `pull_request_target`). Actions are pinned to commit SHAs; Dependabot keeps them updated.
name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # Only builds on main write the Gradle cache; PR builds just read it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build all Minecraft versions
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GreenhouseHelper-jars
          path: build/libs/*.jar
