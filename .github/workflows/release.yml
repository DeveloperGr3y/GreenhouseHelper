# Releases are driven by release-please and Conventional Commit PR titles:
#
#   1. Merge a PR titled e.g. "feat: add a route for TOPA_2" (feat = minor, fix = patch, feat! / fix! = major).
#   2. release-please opens (or updates) a "chore(main): release x.y.z" PR with the changelog and version bump.
#   3. Merging that PR creates the tag + GitHub release; the build job compiles every Minecraft version and the
#      publish job attaches the jars (GitHub adds the source code archives itself).
#
# Security: the build runs third-party code (Gradle plugins, dependencies), so it gets a read-only token and no
# secrets. Only the publish job can write to releases, and it never runs build code; it just uploads the jars.
# Actions are pinned to commit SHAs so a moved tag can't swap in different code (Dependabot keeps them updated).
name: Release

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Optional: a token in RELEASE_PLEASE_TOKEN lets CI run on release PRs automatically.
          # Without it, PRs made by the default token don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # No cache on release builds, so nothing a PR or earlier run left behind can end up in a release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build all Minecraft versions
        env:
          MOD_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$MOD_VERSION" --stacktrace

      - name: Write download table for the release notes
        env:
          MOD_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          prop() { grep "^$1=" "$2" | cut -d= -f2- | tr -d '\r'; }
          loader=$(prop loader_version gradle.properties)
          {
            echo
            echo "## Downloads"
            echo
            echo "| Minecraft | Jar | Fabric API |"
            echo "|---|---|---|"
            for dir in versions/*/; do
              v=$(basename "$dir")
              props="$dir/gradle.properties"
              echo "| $(prop minecraft_range "$props" | sed 's/^~//').x | \`GreenhouseHelper-$MOD_VERSION+mc$v.jar\` | $(prop fabric_api_version "$props") or newer |"
            done
            echo
            echo "Needs Fabric Loader $loader+, Fabric API and Java 25. Kotlin and MoulConfig are bundled; no other mods needed."
            echo
            echo "SHA-256:"
            echo '```'
            (cd build/libs && sha256sum *.jar)
            echo '```'
          } > build/libs/downloads.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jars
          path: |
            build/libs/*.jar
            build/libs/downloads.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jars
          path: dist

      - name: Attach jars and download table to the release
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat dist/downloads.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" dist/*.jar --clobber
